name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm test
      - name: Build and verify the tagged release
        run: |
          python tools/build_release.py --tag "$GITHUB_REF_NAME"
          python tools/check_release.py
      - name: Publish installable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/module.json dist/module.zip dist/SHA256SUMS --verify-tag --title "PF2e Blood Magic Target Damage $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md "${options[@]}"
